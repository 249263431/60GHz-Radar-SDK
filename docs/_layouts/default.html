<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      :root{
        --nav:#0f172a; --nav2:#1e293b; --accent:#0ea5e9; --buy:#f97316;
        --text:#334155; --heading:#0f172a; --link:#2563eb;
        --bg:#f1f5f9; --card:#ffffff;
      }
      * { box-sizing:border-box; }
      body { background:var(--bg); color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif; }

      /* ===== Top nav ===== */
      .site-nav { background:var(--nav); position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.25); }
      .site-nav .bar { max-width:1040px; margin:0 auto; padding:0 18px;
        display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
      .site-nav .brand { color:#fff; font-weight:700; font-size:14px; letter-spacing:.3px;
        text-decoration:none; padding:13px 4px; white-space:nowrap; display:flex; align-items:center; }
      .site-nav .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
        margin-right:9px; box-shadow:0 0 8px var(--accent); }
      .site-nav .brand:hover { color:#e2e8f0; }
      .site-nav ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; }
      .site-nav a.item { display:block; color:#cbd5e1; text-decoration:none;
        padding:14px 13px; font-size:14px; white-space:nowrap; transition:color .15s, background .15s; }
      .site-nav a.item:hover { color:#fff; background:rgba(255,255,255,.07); }
      .site-nav a.buy { background:var(--buy); color:#fff; font-weight:700; border-radius:6px;
        margin:8px 0 8px 8px; padding:8px 15px; transition:background .15s; }
      .site-nav a.buy:hover { background:#fb923c; }
      @media (max-width:720px){
        .site-nav .bar{ flex-direction:column; align-items:stretch; padding:0 10px; }
        .site-nav ul{ flex-direction:column; }
        .site-nav a.item, .site-nav a.buy{ margin:0; border-radius:0; text-align:center; }
      }

      /* ===== Hero ===== */
      header { background:linear-gradient(135deg,var(--nav),var(--nav2)); padding:60px 16px 48px; text-align:center; }
      header h1 { margin:0 0 12px; color:#fff; font-size:34px; font-weight:800; letter-spacing:.2px; }
      header h2 { margin:0 auto; max-width:640px; color:#cbd5e1; font-size:16px; font-weight:400; line-height:1.6; }
      .hero-cta { margin-top:22px; }
      .hero-cta .btn { display:inline-block; margin:6px 5px 0; padding:11px 22px; border-radius:8px;
        font-weight:600; font-size:15px; text-decoration:none; transition:transform .08s ease, opacity .2s; }
      .hero-cta .btn.buy { background:var(--buy); color:#fff; }
      .hero-cta .btn.gh  { background:#334155; color:#fff; }
      .hero-cta .btn:hover { transform:translateY(-1px); opacity:.95; }

      /* ===== Content card ===== */
      #content-wrapper { max-width:940px; margin:30px auto; background:var(--card);
        border-radius:14px; box-shadow:0 1px 3px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.07); overflow:hidden; }
      #content-wrapper .inner { padding:34px 40px; }
      #main-content { font-size:16px; line-height:1.75; color:var(--text); }
      #main-content h1, #main-content h2, #main-content h3 { color:var(--heading); line-height:1.3; margin:1.6em 0 .7em; font-weight:700; }
      #main-content h1 { font-size:28px; margin-top:.2em; }
      #main-content h2 { font-size:22px; border-bottom:1px solid #eef2f7; padding-bottom:.3em; }
      #main-content h3 { font-size:18px; }
      #main-content a { color:var(--link); text-decoration:none; }
      #main-content a:hover { text-decoration:underline; }
      #main-content p, #main-content li { margin:0 0 .9em; }
      #main-content code { background:#f1f5f9; color:#be123c; padding:2px 6px; border-radius:5px; font-size:.9em; }
      #main-content pre { background:#0f172a; color:#e2e8f0; padding:16px 18px; border-radius:10px; overflow:auto; }
      #main-content pre code { background:none; color:inherit; padding:0; }
      #main-content table { width:100%; border-collapse:collapse; margin:1.4em 0; font-size:15px; }
      #main-content th { background:#f1f5f9; color:#0f172a; text-align:left; padding:10px 12px; border:1px solid #e2e8f0; font-weight:700; }
      #main-content td { border:1px solid #e2e8f0; padding:10px 12px; vertical-align:top; }
      #main-content img { max-width:100%; border-radius:10px; }
      #main-content blockquote { margin:1.2em 0; padding:.6em 1.1em; border-left:4px solid var(--accent);
        background:#f0f9ff; color:#0c4a6e; border-radius:0 8px 8px 0; }
      #main-content ul, #main-content ol { padding-left:1.4em; }

      /* ===== Footer ===== */
      footer { border-top:1px solid #eef2f7; padding-top:18px; margin-top:30px; color:#64748b; font-size:14px; text-align:center; }
      footer a { color:#475569; }
      footer p { margin:.5em 0; }
      footer img { margin-top:6px; }

      ::selection { background:#bae6fd; }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <div class="bar">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>{{ site.title }}</a>
        <ul>
          {% for item in site.nav %}
            <li><a class="{% if item.buy %}buy{% else %}item{% endif %}" href="{{ item.url | relative_url }}"{% if item.external %} target="_blank" rel="noopener"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    </nav>

    <header>
      <div class="inner">
        <h1>{{ site.title }}</h1>
        <h2>{{ site.description }}</h2>
        <div class="hero-cta">
          <a class="btn buy" href="https://www.tindie.com/stores/fuxinsuo/" target="_blank" rel="noopener">Buy on Tindie</a>
          <a class="btn gh" href="https://github.com/249263431/60GHz-Radar-SDK" target="_blank" rel="noopener">View on GitHub</a>
        </div>
      </div>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>
        <footer>
          <p>
            <a href="https://www.tindie.com/stores/fuxinsuo/?ref=offsite_badges&utm_source=sellers_fuxinsuo&utm_medium=badges&utm_campaign=badge_medium" target="_blank" rel="noopener">
              <img src="https://static.tindie.com/badges/tindie-mediums.png" alt="I sell on Tindie" width="150" height="78">
            </a>
          </p>
          <p>This project is maintained by <a href="https://github.com/249263431">249263431</a></p>
          <p>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist/minimal">orderedlist</a></p>
        </footer>
      </div>
    </div>

    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
